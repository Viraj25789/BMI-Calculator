<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="stylesheet" href="style.css" />
  <title>BMI Calculator</title>
</head>

<body>
  <div class="container">
    <h1>BMI Calculator</h1>
    <form class="form">
      <div class="details"><label>Height in CM:
        </label><input type="number" id="height" min="0.01" step="any" required placeholder="Enter height in cm" />
      </div>
      <div class="details"><label>Weight in KG:
        </label><input type="number" id="weight" min="0.01" step="any" required placeholder="Enter weight in kg" />
      </div>
      <button type="submit">Calculate</button>
      <div id="results" aria-live="polite"></div>
      <div id="message" aria-live="polite"></div>
      <p id="save-status" role="status" aria-live="polite"></p>
      <div id="weight-guide">
       
        <h3>BMI Weight Guide</h3>
        <p>Underweight = Less than 18.5</p>
        <p>Normal range = 18.5 - 24.9</p>
        <p>Overweight = 25 or higher</p>
        <p class="small">BMI is a general screening measure, not a medical diagnosis.</p>
      </div>
    </form>
  </div>
</body>
<script src="script.js"></script>

</html>
